name: Publish

# Publish pipeline for the three packages in this monorepo.
#
# STATUS: packaging is LIVE, publishing is COMMENTED OUT.
#   Every job builds, version-checks and uploads a artifact you can download and
#   install by hand. Nothing is pushed to npm, the VS Code Marketplace or Open VSX
#   until the blocks marked `ENABLE PUBLISHING` below are uncommented.
#
# ---------------------------------------------------------------------------
# PUBLISH ORDER (matters -- do not skip ahead)
# ---------------------------------------------------------------------------
#   1. grammar    @rweda/tlv-grammar    -> npm
#        Source of truth for the TextMate grammar. Not yet on npm (404).
#   2. tlv        RedwoodEDA.tl-verilog -> Marketplace / Open VSX
#        makerchip declares this in `extensionDependencies`, so VS Code will
#        refuse to install makerchip until tl-verilog is live on the Marketplace.
#   3. makerchip  RedwoodEDA.makerchip  -> Marketplace / Open VSX
#
# ---------------------------------------------------------------------------
# ENABLE PUBLISHING -- checklist
# ---------------------------------------------------------------------------
#   [ ] a. Confirm the pre-publish cleanup is done (see PUBLISHING.md).
#   [ ] b. Azure Entra ID federated credential is registered for the
#          `RedwoodEDA` publisher, and these repo secrets exist:
#            AZURE_CLIENT_ID (an Entra ID app registration, which needs no
#            Azure subscription), AZURE_TENANT_ID
#          (`vsce publish --azure-credential` uses the OIDC token from
#           azure/login -- no VSCE_PAT required.) Verify by running this
#          workflow with target `azure-check` (see that job).
#   [ ] c. For npm: no secret needed. The grammar uses npm trusted publishing
#          (OIDC), the same approach as @rweda/makerchip-view-client.
#          Configure it at npmjs.com -> the package's Settings -> Trusted
#          Publisher -> repo rweda/makerchip-vscode-extension, workflow
#          .github/workflows/publish.yml.
#          CAVEAT: a trusted publisher is configured on an existing package,
#          and @rweda/tlv-grammar is not on npm yet. Expect to publish the
#          first version by hand, then wire up OIDC for later releases.
#   [ ] d. For Open VSX (optional): OVSX_PAT secret.
#   [ ] e. Uncomment the `ENABLE PUBLISHING` blocks in the job(s) you want live.
#          Do them one package at a time, in the publish order above.
#   [ ] f. Push the matching tag:
#            grammar-vX.Y.Z    -> packages/tlv-grammar
#            tlv-vX.Y.Z        -> packages/tlv-extension
#            makerchip-vX.Y.Z  -> packages/makerchip-extension
#          The tag version must match the package.json version or the job fails.

on:
  push:
    tags:
      - "grammar-v*"
      - "tlv-v*"
      - "makerchip-v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Which package to build (and publish, once enabled)"
        required: true
        type: choice
        options:
          - grammar
          - tlv
          - makerchip
          - azure-check

# `id-token: write` is what lets azure/login mint an OIDC token for
# `vsce publish --azure-credential`. Inert while publishing is commented out.
permissions:
  contents: read
  id-token: write

jobs:
  # ===========================================================================
  # Azure check (manual, publishes nothing): proves the Azure federated
  # credential accepts this workflow, and prints the managed identity's Azure
  # DevOps profile `id`, which must be a member of the `RedwoodEDA` publisher
  # (marketplace.visualstudio.com/manage/publishers/RedwoodEDA -> Members).
  # The credential must trust subject
  #   repo:rweda/makerchip-vscode-extension:environment:marketplace
  # (the publish jobs below run in that environment, so one credential covers
  # every release tag; a branch- or tag-scoped credential would not).
  # ===========================================================================
  azure-check:
    if: ${{ github.event.inputs.target == 'azure-check' }}
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - name: Azure login (OIDC federated credential)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Marketplace identity (add its `id` to the publisher's members)
        run: az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798

  # ===========================================================================
  # 1. @rweda/tlv-grammar -> npm
  # ===========================================================================
  publish-grammar:
    if: ${{ startsWith(github.ref, 'refs/tags/grammar-v') || github.event.inputs.target == 'grammar' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tlv-grammar
    steps:
      - uses: actions/checkout@v4

      # Node 22: npm trusted publishing needs npm >= 11.5.1, and npm 11+ will
      # not install on the npm/Node 20 combination the runner ships by default.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Pinned to a major on purpose. @rweda/makerchip-view-client used
      # `npm@latest` here and its publish broke when npm 12 dropped Node 20
      # (EBADENGINE). This step stays active even while publishing is commented
      # out, so the artifact-only runs prove it still resolves.
      - name: Upgrade npm (trusted publishing floor)
        run: npm install -g npm@^11

      - name: Install dependencies (workspace root)
        run: npm ci
        working-directory: .

      - name: Verify tag matches package.json version
        if: ${{ startsWith(github.ref, 'refs/tags/grammar-v') }}
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#grammar-v}"
          echo "package.json: $pkg_version / tag: $tag_version"
          test "$pkg_version" = "$tag_version"

      - name: Pack tarball
        run: npm pack

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: tlv-grammar-npm-tarball
          path: packages/tlv-grammar/*.tgz

      # --- ENABLE PUBLISHING (npm) --------------------------------------
      # Trusted publishing: no NPM_TOKEN. The workflow-level `id-token: write`
      # lets npm mint a short-lived credential and attach provenance.
      # `--access public` is belt-and-braces; also add
      # `"publishConfig": {"access": "public"}` to the grammar's package.json so
      # a manual publish cannot land as restricted either.
      #
      # - name: Publish to npm
      #   run: npm publish --access public
      # ------------------------------------------------------------------

  # ===========================================================================
  # 2. RedwoodEDA.tl-verilog -> Marketplace / Open VSX
  # ===========================================================================
  publish-tlv:
    if: ${{ startsWith(github.ref, 'refs/tags/tlv-v') || github.event.inputs.target == 'tlv' }}
    runs-on: ubuntu-latest
    environment: marketplace  # Trusted by the Azure federated credential (see azure-check)
    defaults:
      run:
        working-directory: packages/tlv-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (workspace root)
        run: npm ci
        working-directory: .

      - name: Verify tag matches package.json version
        if: ${{ startsWith(github.ref, 'refs/tags/tlv-v') }}
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#tlv-v}"
          echo "package.json: $pkg_version / tag: $tag_version"
          test "$pkg_version" = "$tag_version"

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: tlv-extension-vsix
          path: packages/tlv-extension/*.vsix

      # --- ENABLE PUBLISHING (Marketplace) ------------------------------
      # Publishes the exact .vsix built above rather than re-packaging, so
      # what ships is what was uploaded as the artifact.
      #
      # - name: Azure login (OIDC federated credential)
      #   uses: azure/login@v2
      #   with:
      #     client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     allow-no-subscriptions: true
      #
      # - name: Publish to VS Code Marketplace
      #   run: npx --no-install vsce publish --azure-credential --packagePath *.vsix
      # ------------------------------------------------------------------

      # --- ENABLE PUBLISHING (Open VSX, optional) -----------------------
      # Open VSX has no Entra ID support; it still needs a PAT.
      #
      # - name: Publish to Open VSX
      #   run: npx --yes ovsx publish *.vsix -p "$OVSX_PAT"
      #   env:
      #     OVSX_PAT: ${{ secrets.OVSX_PAT }}
      # ------------------------------------------------------------------

  # ===========================================================================
  # 3. RedwoodEDA.makerchip -> Marketplace / Open VSX
  #    Requires RedwoodEDA.tl-verilog to already be live (extensionDependencies).
  # ===========================================================================
  publish-makerchip:
    if: ${{ startsWith(github.ref, 'refs/tags/makerchip-v') || github.event.inputs.target == 'makerchip' }}
    runs-on: ubuntu-latest
    environment: marketplace  # Trusted by the Azure federated credential (see azure-check)
    defaults:
      run:
        working-directory: packages/makerchip-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (workspace root)
        run: npm ci
        working-directory: .

      - name: Verify tag matches package.json version
        if: ${{ startsWith(github.ref, 'refs/tags/makerchip-v') }}
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#makerchip-v}"
          echo "package.json: $pkg_version / tag: $tag_version"
          test "$pkg_version" = "$tag_version"

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: makerchip-extension-vsix
          path: packages/makerchip-extension/*.vsix

      # --- ENABLE PUBLISHING (Marketplace) ------------------------------
      # - name: Azure login (OIDC federated credential)
      #   uses: azure/login@v2
      #   with:
      #     client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     allow-no-subscriptions: true
      #
      # - name: Publish to VS Code Marketplace
      #   run: npx --no-install vsce publish --azure-credential --packagePath *.vsix
      # ------------------------------------------------------------------

      # --- ENABLE PUBLISHING (Open VSX, optional) -----------------------
      # - name: Publish to Open VSX
      #   run: npx --yes ovsx publish *.vsix -p "$OVSX_PAT"
      #   env:
      #     OVSX_PAT: ${{ secrets.OVSX_PAT }}
      # ------------------------------------------------------------------
